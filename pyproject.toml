[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Local tooling for SPILOVEURE development and isolated messenger tests"
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.1.3",
    "boto3>=1.44.3",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi==0.110.1",
    "firebase-admin>=7.8.0",
    "httpx>=0.27.0",
    "mongomock-motor>=0.0.36",
    "motor==3.3.1",
    "pyjwt>=2.10.1",
    "pymongo==4.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.5.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.18",
    "requests>=2.34.2",
    "tzdata>=2026.6",
    "uvicorn[standard]==0.25.0",
    "websockets>=15.0.1,<16",
]

[tool.uv]
package = false
